<!doctype html>
<meta charset="utf-8" />
<title>Interactive citation semantics fixture</title>
<style>
  .closed {
    display: none;
  }
  .invisible {
    visibility: hidden;
  }
</style>
<div id="m-x-content"></div>
<script>
  const root = document.querySelector('#m-x-content');
  const section = document.createElement('section');
  if (new URLSearchParams(location.search).get('layout') === 'main') {
    section.dataset.containerId = 'main-col';
  } else {
    section.dataset.rl = '';
  }
  section.innerHTML = `
    <p>A local fixture, not a captured Google AI Overview.</p>
    <button jsname="HtgYJd" data-index="0">First sources</button>
    <button jsname="HtgYJd" data-index="1">Second sources</button>
    <ul jsname="Z3saHd" class="closed" data-index="0">
      <li><a href="https://example.org/first" aria-label="First reference">First</a></li>
      <li class="invisible"><a href="https://example.org/hidden" aria-label="Hidden reference">Hidden</a></li>
    </ul>
    <ul jsname="Z3saHd" class="closed" data-index="1">
      <li><a href="https://example.org/second" aria-label="Second reference">Second</a></li>
    </ul>`;
  root.append(section);
  section.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button) return;
    setTimeout(() => {
      for (const list of section.querySelectorAll('ul')) {
        list.classList.toggle('closed', list.dataset.index !== button.dataset.index);
      }
    }, 20);
  });
</script>
