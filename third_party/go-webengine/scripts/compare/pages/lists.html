<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>list markers — nested ul + ol</title>
<style>
  body { margin: 16px; font-family: sans-serif; font-size: 16px; color: #111; }
  h2 { font-size: 20px; margin: 0 0 8px; }
</style>
</head>
<body>
  <h2>Unordered (nested)</h2>
  <ul>
    <li>Fruit
      <ul>
        <li>Apple</li>
        <li>Orange
          <ul>
            <li>Navel</li>
            <li>Blood</li>
          </ul>
        </li>
      </ul>
    </li>
    <li>Vegetables</li>
    <li>Grains</li>
  </ul>

  <h2>Ordered (nested + start)</h2>
  <ol>
    <li>First</li>
    <li>Second
      <ol>
        <li>Sub one</li>
        <li>Sub two</li>
      </ol>
    </li>
    <li>Third</li>
  </ol>

  <ol start="10">
    <li>Ten</li>
    <li>Eleven</li>
  </ol>
</body>
</html>
