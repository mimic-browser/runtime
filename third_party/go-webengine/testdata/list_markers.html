<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>list markers</title>
<style>
  body { margin: 0; font-family: sans-serif; font-size: 16px; color: #000; }
  ul, ol { margin: 0; }
</style>
</head>
<body>
  <ul><li>Alpha</li><li>Beta</li></ul>
  <ol><li>One</li><li>Two</li></ol>
</body>
</html>
