<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;background:#ffffff">
<!-- Inline <svg> with a viewBox scaled 2x (50->100), a linearGradient fill,
     a solid fill, a currentColor stroke and a path fill. Text-free, so its
     rasterised bytes are deterministic and byte-golden-safe. -->
<div style="color:#0a7ea4">
<svg width="100" height="100" viewBox="0 0 50 50">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="50" height="25" fill="url(#g)"/>
  <rect x="0" y="25" width="50" height="25" fill="#2244cc"/>
  <circle cx="25" cy="37" r="8" fill="none" stroke="currentColor" stroke-width="3"/>
  <path d="M12 22 L25 6 L38 22 Z" fill="#ee0000"/>
</svg>
</div>
</body>
</html>
