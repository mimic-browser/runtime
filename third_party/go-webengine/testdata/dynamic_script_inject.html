<!doctype html>
<html>
<head>
<title>dynamic script inject</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  #host { width: 120px; height: 60px; background: rgb(1, 2, 3); }
</style>
</head>
<body>
  <div id="host"></div>
  <script>
    // Append a NEW inline <script> element; the engine must execute it (in the
    // same runtime, on a later settle pass) and reflect the DOM mutation it makes.
    var s = document.createElement('script');
    s.textContent = 'document.getElementById("host").style.background = "rgb(40, 50, 60)";';
    document.body.appendChild(s);
  </script>
</body>
</html>
